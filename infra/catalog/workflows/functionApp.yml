# GENERATED by infra/generate.ps1 from infra/infra.map.json (the deploy of {{key}}): don't edit it here.
# Change "deploy" of {{key}} in the map (or an environment's branch), then run .\infra\generate.ps1.
#
{{about}}
name: {{name}}

on:
//#if push
  push:
    branches: {{branches}}{{branchesNote}}
    paths:
{{paths}}
//#end
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to (infra/naming.json; the GitHub environment decides which branches may)'
        type: choice
        options: {{environments}}
        default: {{defaultEnvironment}}

permissions:
  contents: read

jobs:
//#if test
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '{{dotnet}}'
{{testStep}}

//#end
  # The environment this run deploys to: a manual run's choice, else the one whose
  # infra/environments/<env>.json names the pushed branch (infra/route.ps1).
  route:
    name: Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra
      - id: pick
        shell: pwsh
        run: ./infra/route.ps1 -Branch '${{ github.ref_name }}' -Chosen '${{ inputs.environment }}' | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append

  deploy:
    name: Deploy to Azure Functions
    needs: [{{needs}}]
    if: needs.route.outputs.environment != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.route.outputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC: no stored Azure secret
    steps:
      - name: Environment set up?
        id: env
        run: |
          if [ -n "${{ vars.{{appVar}} }}" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No {{appVar}} in this environment yet (.\infra\azure-setup.ps1): deploy skipped."; fi
      - uses: actions/checkout@v4
        if: steps.env.outputs.ready
      - uses: actions/setup-dotnet@v4
        if: steps.env.outputs.ready
        with:
          dotnet-version: '{{dotnet}}'
{{beforeBuild}}
      - name: Publish
        if: steps.env.outputs.ready
        run: dotnet publish {{project}} -c Release{{publishArgs}} -o publish
      - uses: azure/login@v2
        if: steps.env.outputs.ready
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        if: steps.env.outputs.ready
        with:
          app-name: ${{ vars.{{appVar}} }}
          package: publish
//#if flex
          sku: flexconsumption
//#end
{{afterDeploy}}
